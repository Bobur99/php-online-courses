services:
    app:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        working_dir: /var/www
        volumes:
            - .:/var/www
        depends_on:
            - payment-provider

    queue:
        restart: unless-stopped
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        working_dir: /var/www
        command: php artisan queue:work --sleep=1 --tries=3 --timeout=120
        volumes:
            - .:/var/www
        depends_on:
            - database
            - payment-provider

    nginx:
        image: nginx:alpine
        ports:
            - "80:80"
        volumes:
            - .:/var/www
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - app

    database:
        image: postgres:16
        environment:
            POSTGRES_DB: online_courses
            POSTGRES_USER: online_courses
            POSTGRES_PASSWORD: secret
        volumes:
            - postgres_data:/var/lib/postgresql/data

    payment-provider:
        build:
            context: ./services/payment-provider
        environment:
            PAYMENT_CHECKOUT_URL: http://localhost:5173/pay
            PAYMENT_PROVIDER_WEBHOOK_SECRET: ${PAYMENT_PROVIDER_WEBHOOK_SECRET:?Set PAYMENT_PROVIDER_WEBHOOK_SECRET in .env}
        expose:
            - "8080"
        ports:
            - "8080:8080"
        volumes:
            - ./services/payment-provider/storage:/var/www/storage

volumes:
    postgres_data:
