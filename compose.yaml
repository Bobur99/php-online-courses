services:
    app:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        working_dir: /var/www
        volumes:
            - .:/var/www

    nginx:
        image: nginx:alpine
        ports:
            - "80:80"
        volumes:
            - .:/var/www
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - app

    database:
        image: postgres:16
        environment:
            POSTGRES_DB: online_courses
            POSTGRES_USER: online_courses
            POSTGRES_PASSWORD: secret
        volumes:
            - postgres_data:/var/lib/postgresql/data

    payment-provider:
        build:
            context: ./services/payment-provider
        expose:
            - "8080"

volumes:
    postgres_data:
